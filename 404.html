<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#06081a" />
  <title>Lost in space · AttentionCoo</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(900px 600px at 80% 10%, rgba(99, 102, 241, .22), transparent 60%),
        radial-gradient(700px 500px at 10% 80%, rgba(34, 211, 238, .1), transparent 60%),
        #06081a;
      color: #e6e9fb;
      font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.7) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(103,232,249,.55) 0 1px, transparent 1.5px);
      background-size: 90px 90px, 130px 130px;
      background-position: 10px 20px, 60px 70px;
      opacity: .32;
    }
    main {
      position: relative;
      z-index: 1;
      width: min(560px, calc(100vw - 40px));
      padding: 40px;
      border: 1px solid rgba(165, 180, 252, .2);
      border-radius: 28px;
      background: rgba(12, 15, 38, .72);
      box-shadow: 0 30px 100px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(20px);
      text-align: center;
    }
    .code {
      margin-bottom: 18px;
      color: #67e8f9;
      font-family: Consolas, monospace;
      font-size: clamp(56px, 15vw, 96px);
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 0 34px rgba(103,232,249,.35);
    }
    h1 { margin: 0 0 12px; font-size: 24px; }
    p { margin: 0 0 24px; color: #9aa3cf; line-height: 1.7; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 22px;
      border-radius: 999px;
      background: linear-gradient(90deg, #8b5cf6, #22d3ee);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    small { display: block; margin-top: 22px; color: #6f77a8; font-family: Consolas, monospace; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Lost in the star field</h1>
    <p>这颗星球不在当前航线上。这个页面可能已经移动，或者从未存在过。</p>
    <a href="/">Return home · 返回主页</a>
    <small>AttentionCoo · static star map</small>
  </main>
</body>
</html>
